<text class="ts" x="44" y="24" dominant-baseline="central">Area darat · rel hanya di depo kereta (kiri bawah) · hijau putus: traktor ke depo · cokelat putus: conveyor</text>
<g class="ts">
<text x="44" y="404">1  Gerbang utama (pos ISPS, kantor pas, polisi)</text>
<text x="44" y="422">2  X-ray kontainer Bea Cukai (jalur keluar)</text>
<text x="44" y="440">3  Lapangan behandle (periksa fisik)</text>
<text x="44" y="458">4  Parkir truk pra-gate (buffer antre)</text>
<text x="44" y="476">5  Gate peti kemas: OCR, kios, timbangan</text>
<text x="44" y="494">6  Gate + jembatan timbang curah</text>
<text x="44" y="512">7  Gate + jembatan timbang multipurpose</text>
<text x="44" y="530">8  Gate Ro-Ro + PDI + cuci mobil</text>
<text x="44" y="548">9  Karantina hewan, kandang, cuci truk</text>
<text x="44" y="566">10  Depo kontainer kosong + M&amp;R + cuci</text>
<text x="44" y="584">11  Lapangan kontainer berbahaya (DG)</text>
<text x="44" y="602">12  CFS / TPS / gudang berikat</text>
<text x="44" y="620">13  Lapangan penyangga kontainer ke/dari depo KA</text>
<text x="44" y="638">14  Bengkel alat berat + suku cadang</text>
<text x="44" y="656">15  SPBU alat &amp; truk + charging</text>
<text x="44" y="674">16  Gardu induk + genset</text>
<text x="44" y="692">17  Menara air, IPAL, penerimaan limbah</text>
<text x="44" y="710">18  Pos pemadam kebakaran + ambulans</text>
<text x="44" y="728">19  Kantor KSOP (syahbandar, otoritas)</text>
<text x="44" y="746">20  Bea Cukai, imigrasi, karantina</text>
<text x="44" y="764">21  Kantor Pelindo + pusat kendali operasi</text>
<text x="360" y="404">22  Kesehatan pelabuhan (KKP) + klinik</text>
<text x="360" y="422">23  Pusat layanan: loket, dokumen, bank</text>
<text x="360" y="440">24  Masjid, kantin, parkir karyawan</text>
<text x="360" y="458">25  Seafarers' center · 26  Terminal feri</text>
<text x="360" y="476">27  Terminal bus, taksi, parkir penumpang</text>
<text x="360" y="494">28  Kawasan logistik / pusat logistik berikat</text>
<text x="360" y="512">29  Interchange tol · 30  Gerbang zona energi</text>
<text x="360" y="530">31  Parkir truk umum + rest area sopir</text>
<text x="360" y="548">32  Parkir mobil Ro-Ro · 33  Kota</text>
<text x="360" y="574">R1  Jalur utama KA (jembatan atas tol)</text>
<text x="360" y="592">R2  Depo kereta: 6 jalur (3 muat, 3 langsir)</text>
<text x="360" y="610">R3  Dipo lokomotif + bengkel gerbong</text>
<text x="360" y="628">R4  Gate rel di pagar ISPS (OCR, Bea Cukai)</text>
<text x="360" y="646">R5  Muat kontainer: RMG di atas 3 jalur</text>
<text x="360" y="664">R6  Silo loadout curah (diisi conveyor dari jari A)</text>
<text x="360" y="682">R7  Peron + gudang tepi rel (multipurpose)</text>
<text x="360" y="700">R8  Ramp muat mobil ke gerbong car carrier</text>
<text x="360" y="718">R9  Rak muat KA tangki BBM (lewat pipa)</text>
<text x="360" y="742">Tidak ada rel di dermaga dan tidak ada rel</text>
<text x="360" y="758">yang memotong jalan truk.</text>
</g>
