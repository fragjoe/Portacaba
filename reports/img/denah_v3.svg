<text class="ts" x="44" y="24" dominant-baseline="central">Utara ↑   ·   ±3,6 × 2,9 km   ·   1 px = 6 m   ·   kota di timur</text>
<text class="ts" x="44" y="550">1  Jetty LNG + tangki LNG/LPG</text>
<text class="ts" x="44" y="570">2  Jetty minyak, kimia, CPO + tank farm</text>
<text class="ts" x="44" y="590">3  Mercusuar, stasiun pandu, VTS</text>
<text class="ts" x="44" y="610">4  Kolam layanan: tug, pilot, patroli</text>
<text class="ts" x="44" y="630">5  Galangan + dok kering</text>
<text class="ts" x="44" y="650">6  Jari A: curah kering, silo, ternak di kepala</text>
<text class="ts" x="44" y="670">7  Jari B: peti kemas, 4 berth (film: sisi barat)</text>
<text class="ts" x="44" y="690">8  Jari C: multipurpose + gudang, 5 berth</text>
<text class="ts" x="44" y="710">9  Ro-Ro + lapangan parkir mobil</text>
<text class="ts" x="44" y="730">10  Backland: karantina, gate, depo kereta, logistik</text>
<text class="ts" x="44" y="750">11  Ro-Pax / feri</text>
<text class="ts" x="360" y="550">12  Cruise di teluk kota</text>
<text class="ts" x="360" y="570">13  Pinisi / pelra + pelabuhan ikan</text>
<text class="ts" x="360" y="590">14  Marina</text>
<text class="ts" x="360" y="610">15  Tambatan tunggu (layby buoy)</text>
<text class="ts" x="360" y="630">16  Area siaga tug</text>
<text class="ts" x="360" y="650">17  Pilot boarding ground</text>
<text class="ts" x="360" y="670">18  Anchorage kargo + karantina</text>
<text class="ts" x="360" y="690">19  Anchorage tanker / berbahaya</text>
<text class="ts" x="360" y="710">20  Area STS transfer</text>
<text class="ts" x="360" y="730">21  Transshipment tongkang</text>
<text class="ts" x="360" y="750">22  Kota · ungu putus: jalur pandu &amp; tug · abu putus: rute feri</text>
